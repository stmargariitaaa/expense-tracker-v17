<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
    <title>Трекер витрат</title>
</head>
<body>

    <header>
        <h1>Трекер витрат</h1>
    </header>

    <main>

        <!-- Форма додавання витрати/доходу -->
         
        <section>
            <h2>Додати операцію</h2>

            <form class="transaction-form">
                <div class="form-group">
                    <label for="operation-type">Тип операції:</label>
                    <select id="operation-type" name="operation-type">
                        <option value="expense">Витрата</option>
                        <option value="income">Дохід</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Сума:</label>
                        <input type="number" id="amount" name="amount">
                    </div>

                    <div class="form-group">
                        <label for="category">Категорія:</label>
                        <input type="text" id="category" name="category">
                    </div>

                    <div class="form-group">
                        <label for="date">Дата:</label>
                        <input type="date" id="date" name="date">
                    </div>
                </div>

                <button type="submit">Додати операцію</button>
            </form>
        </section>

        <!-- Список операцій -->
        <section>
            <h2>Операції</h2>

            <article class="transaction">
                <h3>
                    <span class="amount amount--expense">-25 €</span>
                    —
                    <span class="category category--expense">Продукти</span>
                </h3>
            </article>

            <article class="transaction">
                <h3>
                    <span class="amount amount--income">+100 €</span>
                    —
                    <span class="category category--income">Дохід</span>
                </h3>
            </article>
        </section>

    </main>

    <!-- Блок підсумкового балансу -->
    <aside>
        <h2>Підсумковий баланс</h2>
        <p class="balance balance--positive">75 €</p>
    </aside>

    <!-- Підвал -->
    <footer>
        <p>Автор: Marharyta Starodubtseva</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
