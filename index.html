<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
    <title>Трекер витрат</title>
</head>

<body>

    <header>
        <h1>Трекер витрат</h1>
    </header>

    <!-- Блок підсумкового балансу: одразу після header, тобто угорі сторінки.
         id="balance" потрібен для оновлення тексту й класу з script.js -->
    <aside>
        <h2>Підсумковий баланс</h2>
        <p id="balance" class="balance balance--positive">75 €</p>
    </aside>

    <main>

        <!-- Форма додавання витрати/доходу -->
        <section>
            <h2>Додати операцію</h2>

            <form class="transaction-form" id="transaction-form">
                <div class="form-group">
                    <label for="type">Тип операції:</label>
                    <select id="type" name="type" required>
                        <option value="витрата">Витрата</option>
                        <option value="дохід">Дохід</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Сума:</label>
                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    <!-- Власне повідомлення про помилку для нуля/від'ємного значення -->
                    <span class="field-error" id="amount-error"></span>
                </div>

                <div class="form-group">
                    <label for="category">Категорія:</label>
                    <input type="text" id="category" name="category" required>
                </div>

                <!-- Поле "Дата" не входить до переліку полів варіанта (amount, type, category) -->
                <div class="form-group">
                    <label for="date">Дата:</label>
                    <input type="date" id="date" name="date">
                </div>
            </div>

            <button type="submit">Додати операцію</button>
        
        </form>
        </section>

        <!-- Список операцій: id додано для доступу через JS -->
        <section>
            <h2>Операції</h2>

            <!-- Фільтрація списку операцій за типом -->
            <div class="form-group">
                <label for="filter-type">Показати:</label>
                <select id="filter-type">
                    <option value="all">Усі</option>
                    <option value="дохід">Дохід</option>
                    <option value="витрата">Витрата</option>
                </select>
            </div>

            <!-- Індикатор завантаження даних з API — прихований за замовчуванням -->
            <p id="loading-indicator" hidden>Завантаження операцій...</p>

            <!-- Повідомлення про помилку завантаження — прихований за замовчуванням -->
            <p id="load-error" class="field-error" hidden></p>

            <!-- Крок 10: кнопка ручного оновлення списку операцій, видима завжди -->
            <button id="refresh-button" type="button">Оновити</button>

            <!-- Кнопка повторної спроби завантаження без перезавантаження всієї сторінки -->
            <button id="retry-button" type="button" hidden>Спробувати ще раз</button>

            <!-- Статичний приклад — орієнтир розмітки, видаляється програмно на старті script.js -->
            <ul id="transactions-list">
                <li class="transaction">25 грн (витрата)</li>
                <li class="transaction">100 грн (дохід)</li>
            </ul>
        </section>

        <!-- Бонус: конвертація суми в іншу валюту через Frankfurter API -->
        <section>
            <h2>Конвертація валюти</h2>

            <form class="transaction-form" id="convert-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="convert-amount">Сума:</label>
                        <input type="number" id="convert-amount" min="0.01" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="convert-from">З валюти:</label>
                        <select id="convert-from">
                            <option value="UAH">UAH</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="PLN">PLN</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="convert-to">В валюту:</label>
                        <select id="convert-to">
                            <option value="EUR">EUR</option>
                            <option value="USD">USD</option>
                            <option value="PLN">PLN</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                </div>

                <button type="submit">Конвертувати</button>
            </form>

            <p id="convert-loading" hidden>Конвертація...</p>
            <p id="convert-result"></p>
            <p id="convert-error" class="field-error" hidden></p>
        </section>

    </main>

    <!-- Підвал -->
    <footer>
        <p>Автор: Marharyta Starodubtseva</p>
    </footer>

</body>
</html>
