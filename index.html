<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
    <title>Трекер витрат</title>
</head>
<body>

    <header>
        <h1>Трекер витрат</h1>
    </header>

    <main>

        <!-- Форма додавання витрати/доходу -->
        <section>
            <h2>Додати операцію</h2>

            <form class="transaction-form">
                <div class="form-group">
                    <label for="operation-type">Тип операції:</label>
                    <select id="operation-type" name="operation-type">
                        <option value="expense">Витрата</option>
                        <option value="income">Дохід</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Сума:</label>
                        <input type="number" id="amount" name="amount">
                    </div>

                    <div class="form-group">
                        <label for="category">Категорія:</label>
                        <input type="text" id="category" name="category">
                    </div>

                    <div class="form-group">
                        <label for="date">Дата:</label>
                        <input type="date" id="date" name="date">
                    </div>
                </div>

                <button type="submit">Додати операцію</button>
            </form>
        </section>

        <!-- Список операцій: id додано для доступу через JS -->
        <section>
            <h2>Операції</h2>
            <!-- Статичний приклад — орієнтир розмітки, видаляється програмно на старті script.js -->
            <ul id="transactions-list">
                <li class="transaction">25 грн (витрата)</li>
                <li class="transaction">100 грн (дохід)</li>
            </ul>
        </section>

    </main>

    <!-- Блок підсумкового балансу -->
    <aside>
        <h2>Підсумковий баланс</h2>
        <p id="balance" class="balance balance--positive">75 €</p>
    </aside>

    <!-- Підвал -->
    <footer>
        <p>Автор: Marharyta Starodubtseva</p>
    </footer>

</body>
</html>
